name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      automation_ref: ${{ github.event.pull_request.merge_commit_sha }}
      package_name: Elavora/.github
      packagist: false
