name: Sincronizar labels reutilizável

# Especificação: docs/labels.md. O repositório fica com exatamente as labels do catálogo (prune total).

on:
  workflow_call:
    inputs:
      automation_ref:
        description: Versão do Elavora/.github (tag estável ou SHA completo), a mesma do uses. Vazia, é descoberta pelo OIDC.
        required: false
        type: string
        default: ''

# Não declara permissions: herda as do job chamador (docs/versao-da-automacao.md, "Permissões").

jobs:
  sync:
    name: Sincronizar labels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Passos comuns: docs/versao-da-automacao.md (os scripts ainda não foram baixados).
      - name: Obter a versão da automação
        id: automation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUTOMATION_REF: ${{ inputs.automation_ref }}
        with:
          script: |
            const OIDC_UNAVAILABLE_MESSAGE = 'não foi possível descobrir a versão do Elavora/.github: conceda "id-token: write" ao job chamador ou informe a entrada automation_ref (PRs de fork não recebem id-token)';
            const input = (process.env.AUTOMATION_REF || '').trim();
            if (input) {
              core.info(`Versão da automação informada: ${input}.`);
              return;
            }

            let idToken;
            try {
              idToken = await core.getIDToken();
            } catch {
              core.setFailed(OIDC_UNAVAILABLE_MESSAGE);
              return;
            }
            core.setSecret(idToken);

            let claims = null;
            try {
              const parts = idToken.split('.');
              if (parts.length === 3) claims = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
            } catch {
              claims = null;
            }
            if (!claims || typeof claims !== 'object' || Array.isArray(claims)) {
              core.setFailed('token OIDC inválido: não foi possível ler as claims');
              return;
            }
            core.setOutput('job_workflow_ref', String(claims.job_workflow_ref ?? ''));
            core.setOutput('job_workflow_sha', String(claims.job_workflow_sha ?? ''));

      - name: Checkout do catálogo e dos scripts do Elavora/.github
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Elavora/.github
          ref: ${{ inputs.automation_ref || steps.automation.outputs.job_workflow_sha }}
          path: .elavora
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/labels.json
            /scripts/

      - name: Conferir a versão da automação
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUTOMATION_REF: ${{ inputs.automation_ref }}
          JOB_WORKFLOW_REF: ${{ steps.automation.outputs.job_workflow_ref }}
          JOB_WORKFLOW_SHA: ${{ steps.automation.outputs.job_workflow_sha }}
        with:
          script: |
            const { resolveAutomationRef } = require(
              `${process.env.GITHUB_WORKSPACE}/.elavora/scripts/automation-ref.cjs`,
            );
            const env = process.env;
            const oidcClaims = env.JOB_WORKFLOW_REF || env.JOB_WORKFLOW_SHA
              ? { job_workflow_ref: env.JOB_WORKFLOW_REF, job_workflow_sha: env.JOB_WORKFLOW_SHA }
              : null;
            try {
              const { ref, source } = resolveAutomationRef({ input: env.AUTOMATION_REF, oidcClaims });
              core.info(`Versão da automação: ${ref} (${source}).`);
            } catch (error) {
              core.setFailed(error.message);
            }

      - name: Aplicar o catálogo
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const base = `${process.env.GITHUB_WORKSPACE}/.elavora`;
            const { validateCatalog, planLabelSync } = require(`${base}/scripts/sync-labels.cjs`);

            // Valida antes de qualquer chamada à API: um catálogo quebrado não pode apagar labels.
            let catalog;
            try {
              catalog = JSON.parse(fs.readFileSync(`${base}/.github/labels.json`, 'utf8'));
              validateCatalog(catalog);
            } catch (error) {
              core.setFailed(`Catálogo de labels inválido, nada foi alterado: ${error.message}`);
              return;
            }

            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner, repo, per_page: 100,
            });
            const plan = planLabelSync(
              catalog,
              existing.map(({ name, color, description }) => ({ name, color, description })),
            );

            for (const { name, color, description } of plan.create) {
              await github.rest.issues.createLabel({ owner, repo, name, color, description });
            }
            for (const { current, name, color, description } of plan.update) {
              await github.rest.issues.updateLabel({
                owner, repo, name: current, new_name: name, color, description,
              });
            }
            for (const name of plan.remove) {
              try {
                await github.rest.issues.deleteLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                core.info(`Label ${name} já não existia.`);
              }
            }

            const list = (names) => (names.length ? names.map((n) => `\`${n}\``).join(', ') : '-');
            await core.summary
              .addHeading('Sincronização de labels', 2)
              .addTable([
                [{ data: 'Ação', header: true }, { data: 'Quantidade', header: true }, { data: 'Labels', header: true }],
                ['Criadas', String(plan.create.length), list(plan.create.map((l) => l.name))],
                ['Atualizadas', String(plan.update.length), list(plan.update.map((l) => l.current === l.name ? l.name : `${l.current} → ${l.name}`))],
                ['Removidas', String(plan.remove.length), list(plan.remove)],
                ['Inalteradas', String(plan.unchanged.length), ''],
              ])
              .write();
