name: Testes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: node --test e actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Testes dos scripts
        run: docker run --rm -v "$PWD:/work:ro" -w /work node:22-alpine node --test "tests/*.test.cjs"

      - name: actionlint
        run: docker run --rm -v "$PWD:/work:ro" -w /work rhysd/actionlint:1.7.7 -color
