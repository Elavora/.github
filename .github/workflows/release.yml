name: Reusable semantic release

on:
  workflow_call:
    inputs:
      package_name:
        description: Composer package name used in release notes.
        required: true
        type: string
      automation_ref:
        description: Immutable commit SHA of Elavora/.github containing this workflow and its helper.
        required: true
        type: string
    secrets:
      PACKAGIST_WEBHOOK_URL:
        required: false
    outputs:
      tag:
        description: Created release tag.
        value: ${{ jobs.release.outputs.tag }}

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: semantic-release-${{ github.repository }}
      queue: max
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out merged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Check out shared release helper
        uses: actions/checkout@v4
        with:
          repository: Elavora/.github
          ref: ${{ inputs.automation_ref }}
          path: .release-tools

      - name: Calculate next version
        id: version
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          TAGS="$(git tag --list 'v*' --format='%(refname:short)')"
          RESULT="$(node .release-tools/scripts/release-version.cjs "$TAGS" "$PR_LABELS")"
          IFS=$'\t' read -r TAG SOURCE_TAG <<< "$RESULT"
          if [[ -n "$SOURCE_TAG" ]]; then
            TARGET_SHA="$(git rev-parse "${SOURCE_TAG}^{commit}")"
          else
            TARGET_SHA="${{ github.event.pull_request.merge_commit_sha }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Create tag, release, and dispatch
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.version.outputs.target_sha }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const sha = process.env.RELEASE_SHA;
            const { owner, repo } = context.repo;
            await github.rest.git.createRef({
              owner, repo, ref: `refs/tags/${tag}`, sha,
            });
            const release = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: sha,
              name: `${process.env.PACKAGE_NAME} ${tag}`,
              prerelease: tag.includes('-'),
              generate_release_notes: true,
            });
            await github.rest.repos.createDispatchEvent({
              owner, repo, event_type: 'tag-created',
              client_payload: { tag, release_id: release.data.id },
            });

      - name: Notify Packagist
        if: env.PACKAGIST_WEBHOOK_URL != ''
        env:
          PACKAGIST_WEBHOOK_URL: ${{ secrets.PACKAGIST_WEBHOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$PACKAGIST_WEBHOOK_URL"
