name: Release reutilizável

# Especificação: docs/release.md e docs/versionamento.md

on:
  workflow_call:
    inputs:
      automation_ref:
        description: Versão do Elavora/.github (tag estável ou SHA completo), a mesma do uses. Vazia, é descoberta pelo OIDC.
        required: false
        type: string
        default: ''
      package_name:
        description: Ignorada a partir da 1.2.0 (o título é sempre owner/repo tag). Continua aceita para não quebrar os chamadores.
        required: false
        type: string
        default: ''
      packagist:
        description: Pede ao Packagist que atualize o pacote depois da release.
        required: false
        type: boolean
        default: true
    secrets:
      PACKAGIST_WEBHOOK_URL:
        description: Endpoint update-package do Packagist com username e apiToken.
        required: false
    outputs:
      tag:
        description: Tag criada ou reaproveitada (vazia quando o merge já foi absorvido por outra tag).
        value: ${{ jobs.release.outputs.tag }}
      prerelease:
        description: "'true' para beta, 'false' para estável."
        value: ${{ jobs.release.outputs.prerelease }}

# Não declara permissions: herda as do job chamador (docs/versao-da-automacao.md, "Permissões").

jobs:
  release:
    name: Criar tag e release
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: elavora-release-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      automation_ref: ${{ steps.automation_ref.outputs.ref }}
    steps:
      # Passos comuns: docs/versao-da-automacao.md (os scripts ainda não foram baixados).
      - name: Obter a versão da automação
        id: automation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUTOMATION_REF: ${{ inputs.automation_ref }}
        with:
          script: |
            const OIDC_UNAVAILABLE_MESSAGE = 'não foi possível descobrir a versão do Elavora/.github: conceda "id-token: write" ao job chamador ou informe a entrada automation_ref (PRs de fork não recebem id-token)';
            const input = (process.env.AUTOMATION_REF || '').trim();
            if (input) {
              core.info(`Versão da automação informada: ${input}.`);
              return;
            }

            let idToken;
            try {
              idToken = await core.getIDToken();
            } catch {
              core.setFailed(OIDC_UNAVAILABLE_MESSAGE);
              return;
            }
            core.setSecret(idToken);

            let claims = null;
            try {
              const parts = idToken.split('.');
              if (parts.length === 3) claims = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
            } catch {
              claims = null;
            }
            if (!claims || typeof claims !== 'object' || Array.isArray(claims)) {
              core.setFailed('token OIDC inválido: não foi possível ler as claims');
              return;
            }
            core.setOutput('job_workflow_ref', String(claims.job_workflow_ref ?? ''));
            core.setOutput('job_workflow_sha', String(claims.job_workflow_sha ?? ''));

      - name: Checkout do merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout dos scripts do Elavora/.github
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Elavora/.github
          ref: ${{ inputs.automation_ref || steps.automation.outputs.job_workflow_sha }}
          path: .elavora
          persist-credentials: false
          sparse-checkout: scripts

      - name: Conferir a versão da automação
        id: automation_ref
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUTOMATION_REF: ${{ inputs.automation_ref }}
          JOB_WORKFLOW_REF: ${{ steps.automation.outputs.job_workflow_ref }}
          JOB_WORKFLOW_SHA: ${{ steps.automation.outputs.job_workflow_sha }}
        with:
          script: |
            const { resolveAutomationRef } = require(
              `${process.env.GITHUB_WORKSPACE}/.elavora/scripts/automation-ref.cjs`,
            );
            const env = process.env;
            const oidcClaims = env.JOB_WORKFLOW_REF || env.JOB_WORKFLOW_SHA
              ? { job_workflow_ref: env.JOB_WORKFLOW_REF, job_workflow_sha: env.JOB_WORKFLOW_SHA }
              : null;
            try {
              const { ref, source } = resolveAutomationRef({ input: env.AUTOMATION_REF, oidcClaims });
              core.info(`Versão da automação: ${ref} (${source}).`);
              core.setOutput('ref', ref);
            } catch (error) {
              core.setFailed(error.message);
            }

      # Idempotência, intervalo de PRs desde a tag de partida e intervalo das notas
      # (docs/release.md, "Intervalo de PRs" e "Intervalo das notas").
      - name: Levantar o intervalo de PRs
        id: interval
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { parseTag, aggregateLabels } = require(
              `${process.env.GITHUB_WORKSPACE}/.elavora/scripts/release-version.cjs`,
            );
            const { assignIntroducedIn } = require(
              `${process.env.GITHUB_WORKSPACE}/.elavora/scripts/release-notes.cjs`,
            );
            const merge = process.env.MERGE_SHA;
            const { owner, repo } = context.repo;
            const event = context.payload.pull_request;
            // Os dados completos dos PRs (com o corpo) vão num arquivo, nunca em outputs.
            const notesFile = path.join(process.env.RUNNER_TEMP, 'elavora-release-notes.json');

            const git = async (...args) => (await exec.getExecOutput('git', args, { silent: true })).stdout.trim();
            const isAncestor = async (ancestor, commit) => (await exec.exec(
              'git', ['merge-base', '--is-ancestor', ancestor, commit], { ignoreReturnCode: true, silent: true },
            )) === 0;
            const rank = (t) => [t.major, t.minor, t.patch, t.beta === null ? Number.MAX_SAFE_INTEGER : t.beta];
            const compare = (a, b) => {
              const ra = rank(a);
              const rb = rank(b);
              for (let i = 0; i < ra.length; i += 1) if (ra[i] !== rb[i]) return ra[i] - rb[i];
              return 0;
            };
            const compareBase = (a, b) => a.major - b.major || a.minor - b.minor || a.patch - b.patch;
            const lines = (text) => text.split('\n').filter(Boolean);

            // PRs integrados na main desde `from` (ou desde o início), com os dados que as notas usam.
            const associatedBySha = new Map();
            const collect = async (from) => {
              const range = from ? `${from.commit}..${merge}` : merge;
              const commits = lines(await git('rev-list', '--first-parent', range));
              const pulls = new Map();
              for (const sha of commits) {
                if (!associatedBySha.has(sha)) {
                  associatedBySha.set(sha, await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                    owner, repo, commit_sha: sha, per_page: 100,
                  }));
                }
                for (const pr of associatedBySha.get(sha)) {
                  if (!pr.merged_at || pr.base?.ref !== 'main') continue;
                  const found = pulls.get(pr.number);
                  if (found) {
                    if (!found.commits.includes(sha)) found.commits.push(sha);
                    continue;
                  }
                  pulls.set(pr.number, {
                    number: pr.number,
                    labels: pr.labels.map((l) => l.name),
                    title: pr.title,
                    url: pr.html_url,
                    author: pr.user?.login ?? null,
                    body: pr.body ?? null,
                    commits: [sha],
                  });
                }
              }

              // O PR do evento entra sempre, com os dados do payload e o merge nos commits.
              const eventCommits = [...(pulls.get(event.number)?.commits ?? [])];
              if (!eventCommits.includes(merge)) eventCommits.push(merge);
              pulls.set(event.number, {
                number: event.number,
                labels: event.labels.map((l) => l.name),
                title: event.title,
                url: event.html_url,
                author: event.user?.login ?? null,
                body: event.body ?? null,
                commits: eventCommits,
              });
              return [...pulls.values()].sort((a, b) => a.number - b.number);
            };

            // Intervalo das notas: na beta, o da versão; na estável, desde a estável anterior.
            // `candidates` são as tags que podem ser partida, estável anterior ou beta (sem a nova tag).
            const writeNotes = async ({ stable, candidates, start, versionPulls }) => {
              const ancestors = [];
              for (const t of candidates) if (await isAncestor(t.commit, merge)) ancestors.push(t);
              let previousStable = null;
              for (const t of ancestors.filter((a) => a.beta === null)) {
                const cmp = previousStable ? compareBase(t, previousStable) : 1;
                if (cmp > 0 || (cmp === 0 && previousStable.legacy && !t.legacy)) previousStable = t;
              }

              const data = {
                previousTag: start ? start.name : null,
                previousStable: previousStable ? previousStable.name : null,
                pulls: [],
                betas: [],
              };
              if (!stable) {
                data.pulls = versionPulls ?? await collect(start);
              } else {
                const pulls = await collect(previousStable);
                const betas = [];
                for (const b of ancestors) {
                  if (b.beta === null || b.legacy) continue;
                  if (previousStable && compareBase(b, previousStable) <= 0) continue;
                  const range = previousStable ? `${previousStable.commit}..${b.commit}` : b.commit;
                  betas.push({ tag: b.name, commits: lines(await git('rev-list', '--first-parent', range)) });
                }
                data.pulls = assignIntroducedIn({ pulls, betas });
                data.betas = betas.map((b) => b.tag);
              }
              fs.writeFileSync(notesFile, JSON.stringify(data));
              core.setOutput('notes_file', notesFile);
            };

            // Só as tags reconhecidas na leitura, com o commit para onde apontam.
            const refs = await git('for-each-ref', 'refs/tags', '--format=%(refname:short) %(objectname) %(*objectname)');
            const tags = [];
            for (const line of refs.split('\n').filter(Boolean)) {
              const [name, object, peeled] = line.split(' ');
              const parsed = parseTag(name);
              if (parsed) tags.push({ ...parsed, commit: peeled || object });
            }
            tags.sort(compare);

            // 1. Uma tag no formato novo já aponta para o merge: reaproveita.
            const reused = tags.filter((t) => !t.legacy && t.commit === merge).at(-1);
            if (reused) {
              core.setOutput('mode', 'reuse');
              core.setOutput('reused_tag', reused.name);
              core.setOutput('pulls', '[]');

              // Release já existe: fica intocada e nada é gerado.
              try {
                await github.rest.repos.getReleaseByTag({ owner, repo, tag: reused.name });
                return;
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              // A release tinha falhado: as notas tratam a tag reaproveitada como a nova.
              const candidates = tags.filter((t) => t.name !== reused.name);
              let reusedStart = null;
              for (const t of candidates) {
                if (await isAncestor(t.commit, merge)) reusedStart = t;
              }
              await writeNotes({ stable: reused.beta === null, candidates, start: reusedStart, versionPulls: null });
              return;
            }

            // 2. O merge já está contido numa tag mais nova: foi absorvido por outra versão.
            for (const t of tags) {
              if (t.commit !== merge && await isAncestor(merge, t.commit)) {
                core.setOutput('mode', 'absorbed');
                core.setOutput('absorbed_by', t.name);
                core.setOutput('pulls', '[]');
                return;
              }
            }

            // 3. Tag de partida: a de maior versão entre as que apontam para um ancestral do merge.
            let start = null;
            for (const t of tags) {
              if (await isAncestor(t.commit, merge)) start = t;
            }
            const list = await collect(start);
            const labels = aggregateLabels(list);
            core.setOutput('mode', 'new');
            core.setOutput('start', start ? start.name : '');
            core.setOutput('labels', JSON.stringify(labels));
            core.setOutput('pulls', JSON.stringify(list.map((p) => ({ number: p.number, labels: p.labels }))));

            // A label release em qualquer PR do intervalo gera estável (docs/versionamento.md).
            const stable = labels.some((label) => label.toLowerCase() === 'release');
            await writeNotes({ stable, candidates: tags, start, versionPulls: list });

      - name: Calcular a versão
        id: version
        if: steps.interval.outputs.mode != 'absorbed'
        env:
          MODE: ${{ steps.interval.outputs.mode }}
          REUSED_TAG: ${{ steps.interval.outputs.reused_tag }}
          LABELS: ${{ steps.interval.outputs.labels }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == 'reuse' ]]; then
            TAG="$REUSED_TAG"
            if [[ "$TAG" == *-beta.* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
            BUMP='(tag reaproveitada)'
            PREVIOUS='-'
            REUSED=true
          else
            TAGS="$(git tag --list)"
            RESULT="$(node .elavora/scripts/release-version.cjs "$TAGS" "$LABELS")"
            TAG="$(jq -r '.tag' <<< "$RESULT")"
            PRERELEASE="$(jq -r '.prerelease' <<< "$RESULT")"
            BUMP="$(jq -r '.bump' <<< "$RESULT")"
            PREVIOUS="$(jq -r '.previous // "-"' <<< "$RESULT")"
            REUSED=false
          fi

          {
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
            echo "bump=$BUMP"
            echo "previous=$PREVIOUS"
            echo "reused=$REUSED"
          } >> "$GITHUB_OUTPUT"

      - name: Criar tag, release e dispatch
        if: steps.version.outputs.tag != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
          RELEASE_REUSED: ${{ steps.version.outputs.reused }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          NOTES_FILE: ${{ steps.interval.outputs.notes_file }}
        with:
          script: |
            const fs = require('node:fs');
            const { releaseTitle, renderReleaseNotes } = require(
              `${process.env.GITHUB_WORKSPACE}/.elavora/scripts/release-notes.cjs`,
            );
            const tag = process.env.RELEASE_TAG;
            const sha = process.env.MERGE_SHA;
            const prerelease = process.env.RELEASE_PRERELEASE === 'true';
            const { owner, repo } = context.repo;
            const repository = process.env.GITHUB_REPOSITORY;

            if (process.env.RELEASE_REUSED !== 'true') {
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha });
            }

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              core.info(`Release ${tag} já existe; reaproveitada.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              if (!process.env.NOTES_FILE || !fs.existsSync(process.env.NOTES_FILE)) {
                throw new Error(`dados das notas da release ${tag} ausentes; reexecute o workflow`);
              }
              const notes = JSON.parse(fs.readFileSync(process.env.NOTES_FILE, 'utf8'));
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: releaseTitle({ repository, tag }),
                body: renderReleaseNotes({ repository, tag, ...notes }),
                prerelease,
                make_latest: prerelease ? 'false' : 'true',
              })).data;
            }

            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: 'tag-created',
              client_payload: { tag, release_id: release.id, prerelease },
            });

      - name: Resumo
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MODE: ${{ steps.interval.outputs.mode }}
          ABSORBED_BY: ${{ steps.interval.outputs.absorbed_by }}
          START_TAG: ${{ steps.interval.outputs.start }}
          PULLS: ${{ steps.interval.outputs.pulls }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
          RELEASE_BUMP: ${{ steps.version.outputs.bump }}
          RELEASE_PREVIOUS: ${{ steps.version.outputs.previous }}
        with:
          script: |
            const env = process.env;
            if (env.MODE === 'absorbed') {
              await core.summary
                .addHeading('Release', 2)
                .addRaw(`Este merge já está contido na tag \`${env.ABSORBED_BY}\`. Nenhuma tag ou release foi criada.`, true)
                .write();
              return;
            }
            const pulls = JSON.parse(env.PULLS || '[]');
            core.summary
              .addHeading(`Release ${env.RELEASE_TAG}`, 2)
              .addTable([
                [{ data: 'Campo', header: true }, { data: 'Valor', header: true }],
                ['Tag', env.RELEASE_TAG],
                ['Pré-release', env.RELEASE_PRERELEASE],
                ['Incremento', env.RELEASE_BUMP],
                ['Estável anterior', env.RELEASE_PREVIOUS],
                ['Tag de partida', env.START_TAG || '-'],
              ]);
            if (pulls.length) {
              core.summary
                .addHeading('PRs do intervalo', 3)
                .addTable([
                  [{ data: 'PR', header: true }, { data: 'Labels', header: true }],
                  ...pulls.map((p) => [`#${p.number}`, p.labels.join(', ') || '-']),
                ]);
            }
            await core.summary.write();

  packagist:
    name: Atualizar Packagist
    needs: release
    if: needs.release.result == 'success' && needs.release.outputs.tag != '' && inputs.packagist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dos scripts do Elavora/.github
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Elavora/.github
          ref: ${{ needs.release.outputs.automation_ref }}
          path: .elavora
          persist-credentials: false
          sparse-checkout: scripts

      - name: Notificar o Packagist
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PACKAGIST_WEBHOOK_URL: ${{ secrets.PACKAGIST_WEBHOOK_URL }}
        with:
          script: |
            const webhookUrl = process.env.PACKAGIST_WEBHOOK_URL;
            if (webhookUrl) {
              core.setSecret(webhookUrl);
              try {
                const token = new URL(webhookUrl).searchParams.get('apiToken');
                if (token) core.setSecret(token);
              } catch {
                // URL inválida: notifyPackagist rejeita com a mensagem de credentials.
              }
            }
            const { notifyPackagist } = require(`${process.env.GITHUB_WORKSPACE}/.elavora/scripts/packagist.cjs`);
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            try {
              const { attempts } = await notifyPackagist({ repository, webhookUrl });
              await core.summary
                .addHeading('Packagist atualizado', 2)
                .addRaw(`Repositório: ${repository}. Tentativas: ${attempts}.`, true)
                .write();
            } catch (error) {
              core.setFailed(error.message);
            }
