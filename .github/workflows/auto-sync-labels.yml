name: Sincronizar labels

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/labels.json

permissions:
  contents: read

jobs:
  sync:
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/sync-labels.yml
    with:
      automation_ref: ${{ github.sha }}
